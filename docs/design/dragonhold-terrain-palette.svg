 fill="#CFC6BC" opacity="0.9"></polygon><path d="M 1370.0 260.0 q 6 -70 46 -52" fill="none" stroke="#EDE6DA" stroke-width="6" stroke-linecap="round" opacity="0.95"></path><path d="M 1402.0 260.0 q 6 -70 46 -52" fill="none" stroke="#EDE6DA" stroke-width="6" stroke-linecap="round" opacity="0.95"></path><path d="M 1434.0 260.0 q 6 -70 46 -52" fill="none" stroke="#EDE6DA" stroke-width="6" stroke-linecap="round" opacity="0.95"></path><path d="M 1466.0 260.0 q 6 -70 46 -52" fill="none" stroke="#EDE6DA" stroke-width="6" stroke-linecap="round" opacity="0.95"></path><rect x="70" y="505" width="150" height="84" rx="10" fill="#1E1A26" opacity="0.95" stroke="none" stroke-width="1.5"></rect><rect x="258" y="505" width="150" height="84" rx="10" fill="#3A3350" opacity="0.95" stroke="none" stroke-width="1.5"></rect><rect x="446" y="505" width="150" height="84" rx="10" fill="#8E8AA3" opacity="0.95" stroke="none" stroke-width="1.5"></rect><rect x="634" y="505" width="150" height="84" rx="10" fill="#EDE6DA" opacity="0.95" stroke="#3A3350" stroke-width="1.5"></rect><rect x="822" y="505" width="150" height="84" rx="10" fill="#5F6B5E" opacity="0.95" stroke="none" stroke-width="1.5"></rect><rect x="1010" y="505" width="150" height="84" rx="10" fill="#A89A86" opacity="0.95" stroke="none" stroke-width="1.5"></rect><rect x="1198" y="505" width="150" height="84" rx="10" fill="#8C3B4A" opacity="0.95" stroke="none" stroke-width="1.5"></rect><rect x="1386" y="505" width="150" height="84" rx="10" fill="#E0A24A" opacity="0.95" stroke="none" stroke-width="1.5"></rect></g>
<g font-family="'Cormorant Garamond',serif"><text x="160" y="388" text-anchor="middle" font-size="27" font-weight="700" fill="#1E1A26">Deadwood</text><text x="160" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">yields Ashwood</text><text x="416" y="388" text-anchor="middle" font-size="27" font-weight="700" fill="#1E1A26">Barrow hills</text><text x="416" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">yields Gravestone</text><text x="672" y="388" text-anchor="middle" font-size="27" font-weight="700" fill="#1E1A26">Blackwheat fields</text><text x="672" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">yields Blackwheat</text><text x="928" y="388" text-anchor="middle" font-size="27" font-weight="700" fill="#1E1A26">Moth moor</text><text x="928" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">yields Moth-silk</text><text x="1184" y="388" text-anchor="middle" font-size="27" font-weight="700" fill="#1E1A26">Iron crags</text><text x="1184" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">yields Iron</text><text x="1440" y="388" text-anchor="middle" font-size="27" font-weight="700" fill="#1E1A26">Ashen waste</text><text x="1440" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">yields nothing</text><text x="1440" y="440" text-anchor="middle" font-size="19" font-style="italic" fill="#3A3350">the Wyrm sleeps here</text><text x="145" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Ink plum</text><text x="145" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#1E1A26</text><text x="333" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Bruised violet</text><text x="333" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#3A3350</text><text x="521" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Ash lavender</text><text x="521" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#8E8AA3</text><text x="709" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Bone white</text><text x="709" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#EDE6DA</text><text x="897" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Moss grey</text><text x="897" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#5F6B5E</text><text x="1085" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Tarnished straw</text><text x="1085" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#A89A86</text><text x="1273" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Dried rose</text><text x="1273" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#8C3B4A</text><text x="1461" y="625" text-anchor="middle" font-size="21" font-weight="600" fill="#1E1A26">Ember gold</text><text x="1461" y="650" text-anchor="middle" font-size="17" fill="#3A3350" letter-spacing="0.06em">#E0A24A</text></g>
<rect width="1600" height="700" filter="url(#paper)" style="mix-blend-mode:multiply"></rect></svg>